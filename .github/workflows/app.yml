name: macOS app

on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/app.yml'
  push:
    branches: [master]

permissions:
  contents: read

# Superseded pull request runs are cancelled; every other event gets a
# unique per-run group, so master validation is never cancelled or queued.
concurrency:
  group: app-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    name: Swift app and PTY regressions
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expose default branch to Git integration tests
        run: |
          git remote set-head origin master
          if ! git show-ref --verify --quiet refs/heads/master; then
            git branch master origin/master
          fi
      - uses: actions/cache@v4
        with:
          path: app/.build
          key: swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            swift-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift') }}-
      - name: Build the app
        run: swift build --package-path app --product Forge
      - name: Run Swift contracts and real PTY regressions
        run: swift run --package-path app ForgeKitTests
