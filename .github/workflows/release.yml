name: Release

on:
  push:
    branches: [master]
    tags:
      - 'v*'

permissions:
  contents: write

# Serialize runs so near-simultaneous pushes (e.g. a batch of merges) don't
# race on the same computed version. Queue, don't cancel -- every push releases.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Resolve version
        id: version
        run: node scripts/forge-release-version.js --check --github-output "$GITHUB_OUTPUT"

      - name: Run deterministic offline release gate
        run: node scripts/forge-release-gate.js --report "${{ runner.temp }}/forge-release-report.json"

      - name: Generate changelog
        if: steps.version.outputs.skip != 'true'
        id: changelog
        run: |
          RANGE="${{ steps.version.outputs.range }}"
          COMMITS=$(git log "$RANGE" --pretty=format:"%H %s" 2>/dev/null || git log --pretty=format:"%H %s")

          BREAKING=""; FEATURES=""; FIXES=""; OTHER=""

          while IFS= read -r line; do
            HASH=$(echo "$line" | cut -c1-7)
            MSG=$(echo "$line" | cut -d' ' -f2-)
            if echo "$MSG" | grep -qiE '^[a-z]+(\(.+\))?!:|BREAKING[ -]CHANGE'; then
              BREAKING="${BREAKING}- ${MSG} (${HASH})\n"
            elif echo "$MSG" | grep -qE '^feat(\(.+\))?:'; then
              FEATURES="${FEATURES}- ${MSG} (${HASH})\n"
            elif echo "$MSG" | grep -qE '^fix(\(.+\))?:'; then
              FIXES="${FIXES}- ${MSG} (${HASH})\n"
            else
              OTHER="${OTHER}- ${MSG} (${HASH})\n"
            fi
          done <<< "$COMMITS"

          {
            if [ -n "$BREAKING" ]; then echo "### Breaking Changes"; echo ""; echo -e "$BREAKING"; fi
            if [ -n "$FEATURES" ]; then echo "### Features"; echo ""; echo -e "$FEATURES"; fi
            if [ -n "$FIXES"    ]; then echo "### Bug Fixes"; echo ""; echo -e "$FIXES"; fi
            if [ -n "$OTHER"    ]; then echo "### Other Changes"; echo ""; echo -e "$OTHER"; fi
          } > /tmp/changelog.md

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"
          # Idempotent: if the release already exists (e.g. a tag-push re-trigger,
          # or a re-run), skip instead of failing with HTTP 422.
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            echo "Release $NEW_TAG already exists -- skipping."
            exit 0
          fi
          # If tag doesn't exist yet (auto-bump case), gh release create will create it.
          # If tag already exists (manual tag case), --verify-tag ensures we use it as-is.
          if git rev-parse "$NEW_TAG" >/dev/null 2>&1; then
            gh release create "$NEW_TAG" \
              --title "$NEW_TAG" \
              --notes-file /tmp/changelog.md \
              --verify-tag
          else
            # Pin the tag to the exact commit that triggered this run -- NOT wherever
            # master happens to point now (which races when pushes land back-to-back).
            gh release create "$NEW_TAG" \
              --title "$NEW_TAG" \
              --notes-file /tmp/changelog.md \
              --target "$GITHUB_SHA"
          fi
