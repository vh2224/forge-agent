name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  operational-offline:
    name: Offline ${{ matrix.host }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: claude
            os: ubuntu-latest
            platform: linux
          - host: codex
            os: ubuntu-latest
            platform: linux
          - host: claude
            os: macos-latest
            platform: darwin
          - host: codex
            os: macos-latest
            platform: darwin
          - host: both
            os: windows-latest
            platform: win32

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic offline operational gate
        run: node scripts/forge-offline-ci.js --host ${{ matrix.host }} --platform ${{ matrix.platform }}

  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            shard-index: 0
            shard-count: 1
            label: ubuntu-latest
          - os: macos-latest
            platform: darwin
            shard-index: 0
            shard-count: 1
            label: macos-latest
          - os: windows-latest
            platform: win32
            shard-index: 0
            shard-count: 2
            label: windows-latest, shard 1/2
          - os: windows-latest
            platform: win32
            shard-index: 1
            shard-count: 2
            label: windows-latest, shard 2/2

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history: the smoke's S07 scope gate resolves its base as the parent
          # of the commit that added scripts/forge-touch.js, and that gate FAILS
          # rather than skipping when the base does not resolve (by design). Under
          # the default depth-1 checkout every file looks added by the single commit
          # present and `<sha>^` does not exist, so the gate could never pass on CI.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify product version matches the prospective release
        if: runner.os == 'Linux'
        run: node scripts/forge-release-version.js --check

      - name: Install Subversion (smoke fixture gate)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Run test suites
        # The baseline is what makes "CI is red" carry information again. Every
        # suite still runs and logs; only the exit code consults the known-failure
        # set for this platform, and it compares BOTH ways — a new red fails, and
        # a suite that healed while staying listed fails too, so the list cannot
        # rot into a green-but-inert gate. Measured cause: 20 of the last 20 PRs
        # merged with windows-latest red, which is why the wrapper-readers break
        # (the #94 x #98 interaction) was indistinguishable from the chronic noise.
        run: node scripts/run-tests.js --baseline scripts/fixtures/ci-baseline/known-failures.json --shard-index ${{ matrix.shard-index }} --shard-count ${{ matrix.shard-count }}

      - name: Smoke suite (release gate)
        if: runner.os != 'Windows'
        run: node scripts/forge-smoke.js

  required-offline-windows:
    name: Offline ${{ matrix.host }} / win32
    needs: operational-offline
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host:
          - claude
          - codex
    steps:
      - name: Preserve required-check contract
        run: test "${{ needs.operational-offline.result }}" = success

  required-tests-windows:
    name: Tests (windows-latest)
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Preserve required-check contract
        run: test "${{ needs.test.result }}" = success
