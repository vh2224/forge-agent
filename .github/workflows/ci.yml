name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

# Superseded pull request runs are cancelled; every other event gets a
# unique per-run group, so master validation is never cancelled or queued.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  operational-offline:
    name: Offline ${{ matrix.host }} / ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: both
            os: ubuntu-latest
            platform: linux
          - host: both
            os: macos-latest
            platform: darwin
          - host: both
            os: windows-latest
            platform: win32

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic offline operational gate
        run: node scripts/forge-offline-ci.js --host ${{ matrix.host }} --platform ${{ matrix.platform }}

  test:
    name: Tests (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 32
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            shard-index: 0
            shard-count: 24
            label: ubuntu-latest, shard 1/24
            workers: 2
            single-worker-jobs: 2
